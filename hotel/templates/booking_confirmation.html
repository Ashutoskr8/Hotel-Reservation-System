<!doctype html><html><head><title>Booking confirmed</title><style>body{font-family:Arial;max-width:650px;margin:55px auto;text-align:center}.box{border:2px solid #198754;border-radius:12px;padding:32px}a{color:#173b6c}</style></head><body><div class="box"><h1>✓ Booking confirmed</h1><h2>{{ booking.hotel.name }}</h2><p>Confirmation #{{ booking.id }}</p><p>Room {{ booking.room.room_number }} · {{ booking.check_in }} → {{ booking.check_out }}</p><p>{{ booking.guests }} guest{{ booking.guests|pluralize }} · ₹{{ booking.total_amount }} paid</p><p><a href="{% url 'user:my_bookings' %}">View my bookings</a></p></div></body></html>
