<!doctype html><html><head><title>Reserve</title><style>body{font-family:Arial;max-width:620px;margin:40px auto;padding:20px}main{padding:28px;border-radius:12px;box-shadow:0 2px 12px #ccc}input,button{box-sizing:border-box;width:100%;padding:11px;margin:7px 0 17px}button{background:#173b6c;color:white;border:0;border-radius:6px}</style></head><body><main><p><a href="{% url 'user:hotel_list' %}">← Back</a></p><h1>Reserve Room {{ room.room_number }}</h1><p><b>{{ room.hotel.name }}</b> · {{ room.get_room_type_display }} · ₹{{ room.price_per_night }}/night · Max {{ room.max_guests }} guests</p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post" action="{% url 'user:hotel_book_status' %}">{% csrf_token %}<input type="hidden" name="room_id" value="{{ room.id }}"><label>Check-in</label><input type="date" name="from_date" min="{{ today }}" required><label>Check-out</label><input type="date" name="to_date" min="{{ today }}" required><label>Guests</label><input type="number" name="guests" min="1" max="{{ room.max_guests }}" value="1" required><button>Continue to mock payment</button></form></main></body></html>
