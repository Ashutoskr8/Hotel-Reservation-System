<!doctype html><html><head><title>Create account</title><style>body{font-family:Arial;background:#f2f7ff;display:grid;place-items:center;min-height:90vh}.container{background:#fff;width:360px;padding:32px;border-radius:12px;box-shadow:0 3px 18px #ccd3df}label{display:block;font-weight:bold;margin-top:14px}input{box-sizing:border-box;width:100%;padding:11px;margin-top:5px;border:1px solid #b8c1cf;border-radius:5px}button{width:100%;padding:12px;margin-top:22px;background:#173b6c;color:#fff;border:0;border-radius:5px;font-size:16px}.required{color:#b21}</style></head><body><div class="container"><h1>Create your account</h1><p>Tell us your location so we can show hotels near you.</p>{% if msg %}<p class="required">{{ msg }}</p>{% endif %}<form method="post" action="{% url 'user:store_user' %}">{% csrf_token %}<label for="username">Username <span class="required">*</span></label><input id="username" name="username" required><label for="name">Full name <span class="required">*</span></label><input id="name" name="name" required><label for="location">Your city / preferred location <span class="required">*</span></label><input id="location" name="location" placeholder="Example: Bengaluru" required><label for="password">Password <span class="required">*</span></label><input id="password" type="password" name="password" minlength="8" required><button>Create account</button></form><p>Already registered? <a href="{% url 'user:login' %}">Sign in</a></p></div></body></html>
