<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
  <style>
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-image: linear-gradient(45deg, #F6FDC3, #FFCF96);
  }
  
  .login-container {
    background-color: #fff;
    padding: 100px;
    border-radius: 5px;
    box-shadow: 5px 10px 20px rgba(0, 0, 0, 0.1);
    font-size: 20px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    margin-bottom: 5px;
  }
  
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  
  button {
    background-color: #650c51;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  
  button:hover {
    background-color: #ad6ce5;
  }
  h1{
    text-align: center;
    color:rgba(92, 41, 234, 0.929);
  }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>
    {{msg}}
    <form action="{% url 'user:login' %}" method="POST">
        {% csrf_token %}
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" value="submit">Login</button>
    </form>
  </div>
</body>
</html>
