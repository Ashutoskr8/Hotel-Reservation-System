<!doctype html><html><head><title>Profile</title><style>body{font-family:Arial;max-width:560px;margin:40px auto;padding:20px}input,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0 14px}button{background:#173b6c;color:#fff;border:0;border-radius:5px}</style></head><body><p><a href="{% url 'user:homepage' %}">← Welcome</a></p><h1>Update profile</h1><form method="post" action="{% url 'user:profile_save' %}">{% csrf_token %}<label>Preferred city / location</label><input type="text" name="location" value="{{ profile.location }}" placeholder="e.g. Bengaluru" required><label>Father's name</label><input type="text" name="fathers_name" value="{{ profile.fathers_name }}"><label>Mother's name</label><input type="text" name="mothers_name" value="{{ profile.mothers_name }}"><label>Email</label><input type="email" name="email" value="{{ profile.email }}"><label>Phone</label><input type="tel" name="phone" value="{{ profile.phone }}"><button>Save profile</button></form></body></html>
