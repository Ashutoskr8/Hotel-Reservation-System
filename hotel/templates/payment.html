<!doctype html><html><head><title>Payment</title><style>body{font-family:Arial;max-width:600px;margin:45px auto;padding:22px}main{border:1px solid #ddd;padding:24px;border-radius:9px}button,select{padding:10px;width:100%;margin:12px 0}button{background:#173b6c;color:#fff;border:0;border-radius:5px}</style></head><body><main><h1>Mock payment</h1><p>Booking #{{ booking.id }} · {{ booking.hotel.name }}</p><p>{{ booking.nights }} nights: ₹{{ booking.subtotal }}<br>Tax (18%): ₹{{ booking.tax }}<br><b>Total: ₹{{ booking.total_amount }}</b></p><form method="post">{% csrf_token %}<label>Payment method</label><select name="method">{% for value,label in methods %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><button>Pay ₹{{ booking.total_amount }}</button></form><small>This is a demo gateway; no real charge is made.</small></main></body></html>
